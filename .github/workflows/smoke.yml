# The action installs fastpilot (checksum verified) on Linux and macOS, and fails on a bad version.
name: smoke
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        version: [latest, 0.4.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: fp
        uses: ./
        with:
          version: ${{ matrix.version }}
          install-only: 'true'
      - name: fastpilot is on PATH and is the version installed
        shell: bash
        env:
          WANT: ${{ steps.fp.outputs.version }}
        run: |
          out="$(fastpilot --version)"
          echo "$out"
          [ "$out" = "fastpilot ${WANT}" ]
  refuses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: bad
        uses: ./
        continue-on-error: true
        with:
          version: '1.0; echo injected'
          install-only: 'true'
      - name: a bad version is refused
        shell: bash
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: '[ "$OUTCOME" = failure ] && ! command -v fastpilot'
